server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    basedir: ${java.io.tmpdir}/tomcat-english-learning
    max-threads: 200

spring:
  application:
    name: english-learning-platform
    main:
      allow-bean-definition-overriding: true
  # 引入事件配置文件
  profiles:
    active: spring-event-handler
  datasource:
    # H2 数据库配置（开发环境）
    url: jdbc:h2:file:./data/englishLearnPlatform.db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
      file-size-threshold: 2MB
      location: ${java.io.tmpdir}/english-learning-uploads

# 文件存储配置
file:
  storage:
    root: ./boot/uploads
  upload:
    dir: ./boot/uploads
  access:
    url: /files

# Axon 框架配置
axon:
  axonserver:
    enabled: false
  serializer:
    general: xstream
    messages: jackson
    events: jackson

# Spring Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

# 日志配置
logging:
  level:
    root: info
    com:
      englishlearning: debug
    org:
      springframework:
        web: info
      boot: info
      data: info
      jpa: info
      security: info
      hibernate:
        SQL: debug
        type: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/english-learning-platform.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB
