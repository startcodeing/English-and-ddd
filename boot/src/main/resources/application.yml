server:
  port: 8080
  context-path: /

spring:
  application:
    name: english-learning-platform
  main:
    allow-bean-definition-overriding: true
  # 引入事件配置文件
  profiles:
    active: spring-event-handler
  datasource:
    #内存数据库，服务停止数据会丢失
    #url: jdbc:h2:mem:englishdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
    url: jdbc:h2:file:./data/englishLearnPlatform.db
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.englishlearning: info
    org.springframework: warn

# 文件存储配置
file:
  upload-dir: uploads
  access-url: /files
  max-file-size: 10485760 # 10MB

axon:
  axonserver:
    enabled: false